name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { echo "Run gofmt:"; gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race ./...
